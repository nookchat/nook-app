# The Nook server. Easiest install (writes this file and a .env, then starts it):
#
#   curl -fsSL https://raw.githubusercontent.com/nookchat/nook-app/main/server/install.sh | sh
#
# By hand: set CATHODE_DOMAIN=your.domain in a .env next to this file, then run
#   docker compose up -d
#
#   cathode   the server
#   db        Postgres, which holds the spaces as ciphertext
#   caddy     HTTPS with a Let's Encrypt certificate (profile tls)
#   turn      coturn, for calls on networks that block them (profile turn)
#
# Local try-out: docker compose up -d cathode, then use http://localhost:8787 in Nook.
# Update: run the installer again, or docker compose pull && docker compose up -d
# A line in .env overrides any default below. See server/README.md.

name: cathode

services:
  cathode:
    image: ${CATHODE_IMAGE:-ghcr.io/nookchat/cathode-server:latest}
    build: .
    container_name: cathode
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Plain HTTP, local only. Set CATHODE_BIND=0.0.0.0 for your own proxy.
      - '${CATHODE_BIND:-127.0.0.1}:8787:8787'
    volumes:
      # Sealed uploads in /data/files. Back this up with the database.
      - cathode-data:/data
    environment:
      DATABASE_URL: postgres://cathode:${POSTGRES_PASSWORD:-cathode}@db:5432/cathode
      # The server's domain. Its public and TURN addresses default from it.
      CATHODE_DOMAIN: ${CATHODE_DOMAIN:-}
      CATHODE_PUBLIC_URL: ${CATHODE_PUBLIC_URL:-}
      # Pages that may use this server, comma separated. * is any page.
      CATHODE_ORIGINS: ${CATHODE_ORIGINS:-*}
      # TURN for calls: on when a secret is set.
      CATHODE_TURN_SECRET: ${CATHODE_TURN_SECRET:-}
      CATHODE_TURN_URLS: ${CATHODE_TURN_URLS:-}
      CATHODE_TURN_ONLY: ${CATHODE_TURN_ONLY:-1}
      # A cluster with friends. Empty runs alone.
      CATHODE_PEERS: ${CATHODE_PEERS:-}
      CATHODE_CLUSTER_SECRET: ${CATHODE_CLUSTER_SECRET:-}
      # Byte limits: one file, files per space, lines per space.
      CATHODE_MAX_FILE_BYTES: ${CATHODE_MAX_FILE_BYTES:-104857600}
      CATHODE_MAX_ROOM_FILE_BYTES: ${CATHODE_MAX_ROOM_FILE_BYTES:-5368709120}
      CATHODE_MAX_ROOM_BYTES: ${CATHODE_MAX_ROOM_BYTES:-268435456}
      # Link cards. 0 stops the server from seeing which links are previewed.
      CATHODE_PREVIEWS: ${CATHODE_PREVIEWS:-1}
      # GIF search, off until one key is set.
      CATHODE_KLIPY_KEY: ${CATHODE_KLIPY_KEY:-}
      CATHODE_TENOR_KEY: ${CATHODE_TENOR_KEY:-}
      CATHODE_GIPHY_KEY: ${CATHODE_GIPHY_KEY:-}

  db:
    image: postgres:17-alpine
    container_name: cathode-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cathode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cathode}
      POSTGRES_DB: cathode
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cathode -d cathode']
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2
    container_name: cathode-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    # HTTPS for the domain, proxied to the server with WebSockets. No Caddyfile needed.
    command: caddy reverse-proxy --from ${CATHODE_DOMAIN:-localhost} --to cathode:8787
    volumes:
      - caddy-data:/data
    depends_on:
      - cathode
    profiles: ['tls']

  turn:
    image: coturn/coturn:4.6
    container_name: cathode-turn
    restart: unless-stopped
    # Host networking gives TURN its wide UDP port range.
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${CATHODE_TURN_SECRET:-}
      - --realm=${CATHODE_DOMAIN:-cathode}
      - --external-ip=$$(detect-external-ip)
      - --min-port=${CATHODE_TURN_MIN_PORT:-49160}
      - --max-port=${CATHODE_TURN_MAX_PORT:-49260}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      # Never relay into private networks.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
    profiles: ['turn']

volumes:
  cathode-data:
  db-data:
  caddy-data:
