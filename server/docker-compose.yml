# The Nook server, on a machine of your own.
#
# The easy way, which writes this file and a .env beside it and starts it:
#
#   curl -fsSL https://raw.githubusercontent.com/nebbsie/stream/main/server/install.sh | sh
#
# By hand: put CATHODE_DOMAIN=your.domain in a .env next to this file (the
# rest has defaults), then
#
#   docker compose up -d
#
# Four containers:
#
#   cathode   the server: spaces, the WebSocket, the API, TURN credentials
#   db        Postgres, where the spaces are kept (as ciphertext)
#   caddy     HTTPS for your domain, with a certificate from Let's Encrypt
#   turn      coturn, which carries calls on networks that block them
#
# Only the server and its database, to try it on this machine:
#
#   docker compose up -d cathode
#
# and use http://localhost:8787 as the server address in Nook.
#
# Update to the newest server: run the installer again, or
#
#   docker compose pull && docker compose up -d
#
# Every setting below has a default, and a line in .env overrides it. See
# server/README.md for all of them.

name: cathode

services:
  cathode:
    image: ${CATHODE_IMAGE:-ghcr.io/nebbsie/cathode-server:latest}
    build: .
    container_name: cathode
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Plain HTTP, so only this machine by default: the world comes in through
      # Caddy. Set CATHODE_BIND=0.0.0.0 to put your own proxy in front instead.
      - '${CATHODE_BIND:-127.0.0.1}:8787:8787'
    volumes:
      # Uploaded files, sealed, in /data/files. Back this up beside the database.
      - cathode-data:/data
    environment:
      DATABASE_URL: postgres://cathode:${POSTGRES_PASSWORD:-cathode}@db:5432/cathode
      # The name this server answers on. Its address and its TURN addresses follow from it.
      CATHODE_DOMAIN: ${CATHODE_DOMAIN:-}
      CATHODE_PUBLIC_URL: ${CATHODE_PUBLIC_URL:-}
      # The pages that may use this server. * is any page, which is what a
      # server for friends wants; narrow it to your own page if you like.
      CATHODE_ORIGINS: ${CATHODE_ORIGINS:-*}
      # TURN, for calls: on when the installer made a secret for it.
      CATHODE_TURN_SECRET: ${CATHODE_TURN_SECRET:-}
      CATHODE_TURN_URLS: ${CATHODE_TURN_URLS:-}
      CATHODE_TURN_ONLY: ${CATHODE_TURN_ONLY:-1}
      # A cluster with friends. Empty runs on its own. See server/README.md.
      CATHODE_PEERS: ${CATHODE_PEERS:-}
      CATHODE_CLUSTER_SECRET: ${CATHODE_CLUSTER_SECRET:-}
      # Files: the largest one may be, and how much one space may keep.
      CATHODE_MAX_FILE_BYTES: ${CATHODE_MAX_FILE_BYTES:-104857600}
      CATHODE_MAX_ROOM_FILE_BYTES: ${CATHODE_MAX_ROOM_FILE_BYTES:-5368709120}
      CATHODE_MAX_ROOM_BYTES: ${CATHODE_MAX_ROOM_BYTES:-268435456}
      # Link cards: 0 stops this server learning which links people preview.
      CATHODE_PREVIEWS: ${CATHODE_PREVIEWS:-1}
      # GIF search for everybody here, off until a key is given. One is enough.
      CATHODE_KLIPY_KEY: ${CATHODE_KLIPY_KEY:-}
      CATHODE_TENOR_KEY: ${CATHODE_TENOR_KEY:-}
      CATHODE_GIPHY_KEY: ${CATHODE_GIPHY_KEY:-}

  db:
    image: postgres:17-alpine
    container_name: cathode-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cathode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cathode}
      POSTGRES_DB: cathode
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cathode -d cathode']
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2
    container_name: cathode-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    # HTTPS for the domain, and everything passed to the server, WebSockets
    # included. No Caddyfile: this is all it needs.
    command: caddy reverse-proxy --from ${CATHODE_DOMAIN:-localhost} --to cathode:8787
    volumes:
      - caddy-data:/data
    depends_on:
      - cathode
    profiles: ['tls']

  turn:
    image: coturn/coturn:4.6
    container_name: cathode-turn
    restart: unless-stopped
    # TURN needs a wide range of UDP ports, and host networking is the only
    # sane way to give a container one.
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${CATHODE_TURN_SECRET:-}
      - --realm=${CATHODE_DOMAIN:-cathode}
      - --external-ip=$$(detect-external-ip)
      - --min-port=${CATHODE_TURN_MIN_PORT:-49160}
      - --max-port=${CATHODE_TURN_MAX_PORT:-49260}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      # Never relay into this machine's own network.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
    profiles: ['turn']

volumes:
  cathode-data:
  db-data:
  caddy-data:
