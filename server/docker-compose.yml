# The Cathode server, on a machine of your own.
#
#   cp server/.env.example server/.env    then fill it in
#   docker compose -f server/docker-compose.yml up -d
#
# Four containers:
#
#   cathode   the server: spaces, the WebSocket per space, the API, TURN credentials
#   db        Postgres, where the spaces are kept (as ciphertext)
#   turn      coturn, which carries calls and screen shares
#   caddy     HTTPS for cathode, with a certificate from Let's Encrypt
#
# The page itself stays where it is (Vercel, or any static host). People add
# this server in the page, under Add your server, or join it from an invite.
#
# A cluster: several people each run this on their own machine, with the same
# CATHODE_CLUSTER_SECRET and each other's addresses in CATHODE_PEERS. Every
# space is then kept on all of them. See server/README.md.
#
# Update to the newest published image:
#
#   docker compose -f server/docker-compose.yml pull && docker compose -f server/docker-compose.yml up -d
#
# Only the server and its database, for a try on this machine:
#
#   docker compose -f server/docker-compose.yml up -d cathode
#
# and use http://localhost:8787 as the server address.

name: cathode

services:
  cathode:
    image: ${CATHODE_IMAGE:-ghcr.io/nebbsie/cathode-server:latest}
    build: .
    container_name: cathode
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Plain HTTP, so only this machine by default: the world comes in through
      # Caddy. Set CATHODE_BIND=0.0.0.0 to put your own proxy in front instead.
      - '${CATHODE_BIND:-127.0.0.1}:8787:8787'
    volumes:
      # Uploaded files, sealed, in /data/files. Back this up beside the database.
      - cathode-data:/data
    environment:
      DATABASE_URL: postgres://cathode:${POSTGRES_PASSWORD:-cathode}@db:5432/cathode
      # How much ciphertext one space may keep before the oldest is dropped.
      CATHODE_MAX_ROOM_BYTES: ${CATHODE_MAX_ROOM_BYTES:-268435456}
      # The pages that may use this server. * is any page.
      CATHODE_ORIGINS: ${CATHODE_ORIGINS:-*}
      # TURN, handed to every space on this server. Empty turns it off.
      CATHODE_TURN_URLS: ${CATHODE_TURN_URLS:-}
      CATHODE_TURN_SECRET: ${CATHODE_TURN_SECRET:-}
      CATHODE_TURN_ONLY: ${CATHODE_TURN_ONLY:-1}
      # The cluster. Leave CATHODE_PEERS empty to run on your own.
      CATHODE_PUBLIC_URL: ${CATHODE_PUBLIC_URL:-}
      CATHODE_PEERS: ${CATHODE_PEERS:-}
      CATHODE_CLUSTER_SECRET: ${CATHODE_CLUSTER_SECRET:-}
      # Link cards: 0 stops this server learning which links people preview.
      CATHODE_PREVIEWS: ${CATHODE_PREVIEWS:-1}
      # Optional GIF search for /gif. See server/README.md.
      CATHODE_TENOR_KEY: ${CATHODE_TENOR_KEY:-}
      # Files: the largest one may be, and how much one space may keep.
      CATHODE_MAX_FILE_BYTES: ${CATHODE_MAX_FILE_BYTES:-104857600}
      CATHODE_MAX_ROOM_FILE_BYTES: ${CATHODE_MAX_ROOM_FILE_BYTES:-5368709120}

  db:
    image: postgres:17-alpine
    container_name: cathode-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cathode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cathode}
      POSTGRES_DB: cathode
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cathode -d cathode']
      interval: 5s
      timeout: 3s
      retries: 20

  turn:
    image: coturn/coturn:4.6
    container_name: cathode-turn
    restart: unless-stopped
    # TURN needs a wide range of UDP ports, and host networking is the only
    # sane way to give a container one.
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${CATHODE_TURN_SECRET:-}
      - --realm=${CATHODE_DOMAIN:-cathode}
      - --external-ip=$$(detect-external-ip)
      - --min-port=${CATHODE_TURN_MIN_PORT:-49160}
      - --max-port=${CATHODE_TURN_MAX_PORT:-49260}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      # Never relay into this machine's own network.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
    profiles: ['turn']

  caddy:
    image: caddy:2
    container_name: cathode-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      CATHODE_DOMAIN: ${CATHODE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - cathode
    profiles: ['tls']

volumes:
  cathode-data:
  db-data:
  caddy-data:
