# Builds the desktop app on macOS, Windows and Linux, each on its own system,
# and publishes a GitHub release that the desktop apps update from.
#
# To release: raise "version" in package.json and desktop/package.json, commit,
# then push a tag of that version, such as v0.3.2. The builds go to a draft
# release, with SHA256SUMS.txt, and the release is published once all are there.
#
# Run it by hand to build without a release: the builds are kept as the run's
# artifacts. Tick "publish" to release the version in desktop/package.json.

name: desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release of the version in desktop/package.json
        type: boolean
        default: false

# Read only, unless a job says more. The builds run npm and electron-builder, with all their
# dependencies: none of that code gets a token that can change the release or the repository.
permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: version
        name: The version, and whether it is released
        run: |
          tag="v$(node -p "require('./desktop/package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but desktop/package.json says $tag."
            exit 1
          fi
          publish=false
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "${{ inputs.publish }}" = true ]; then publish=true; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: A draft release to put the builds in
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG is there already; the builds replace its files."
          else
            gh release create "$TAG" --draft --title "${TAG#v}" --target "$GITHUB_SHA" --generate-notes
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac dmg --x64 --arm64
          - os: windows-latest
            args: --win --x64
          - os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build
        # No signing certificate here: macOS gets the ad hoc signature the config asks for.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nook-${{ runner.os }}
          path: |
            desktop/release/Nook-*
            desktop/release/latest*.yml
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # The one job that writes the release. It runs no build tools: only the builds, as made.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nook-*
          path: builds
          merge-multiple: true
      - name: Put the builds in the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" builds/Nook-* builds/latest*.yml --clobber
      - name: SHA256SUMS.txt, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D out -p 'Nook-*.dmg' -p 'Nook-*.exe' -p 'Nook-*.AppImage'
          (cd out && sha256sum Nook-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" out/SHA256SUMS.txt --clobber
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
