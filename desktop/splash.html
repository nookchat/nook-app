<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Nook</title>
    <script>
      // The theme the app picked last goes on before the first paint, as in index.html.
      ;(function () {
        var theme = new URLSearchParams(location.search).get('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      })()
    </script>
    <style>
      /* The loading screen of index.html, word for word but for what is marked. It shows before the
         page has come, and the page's own screen takes its place with no jump: the ghost holds still
         once it has peeked in, and the bar stays empty, as they are when the page's screen starts. */
      :root { --boot-page: #FDF6F3; --boot-brand: #191412; --boot-on-brand: #FDF6F3; --boot-track: #ECDFDA; --boot-words: #6F6561; }
      :root[data-theme="dark"] { --boot-page: #100C0B; --boot-brand: #FDF6F3; --boot-on-brand: #191412; --boot-track: #312A27; --boot-words: #A89F9C; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { --boot-page: #100C0B; --boot-brand: #FDF6F3; --boot-on-brand: #191412; --boot-track: #312A27; --boot-words: #A89F9C; }
      }
      html, body { margin: 0; background: var(--boot-page); }
      #boot {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background: var(--boot-page);
        transition: opacity 0.28s ease, transform 0.28s ease;
      }
      #boot.gone { opacity: 0; transform: scale(1.02); pointer-events: none; }
      #boot .boot-stage { position: relative; width: 104px; height: 104px; }
      #boot .boot-ghost {
        position: absolute; left: 0; top: 0; width: 104px; height: 104px; overflow: visible;
        animation: boot-peek 0.56s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      #boot .boot-body { fill: var(--boot-brand); }
      #boot .boot-eyes { fill: var(--boot-on-brand); transform-box: fill-box; transform-origin: center; animation: boot-blink 5.2s ease-in-out 1.2s infinite; }
      #boot .boot-cheeks { fill: #FF8A5B; }
      #boot .boot-shadow {
        position: absolute; left: 28px; bottom: 4px; width: 48px; height: 7px; border-radius: 50%;
        background: var(--boot-brand); opacity: 0.12;
        animation: boot-fade 0.56s ease both;
      }
      #boot .boot-word { height: 26px; margin-top: 18px; fill: var(--boot-brand); animation: boot-rise 0.4s ease 0.22s both; }
      #boot .boot-bar {
        position: relative; width: 176px; height: 4px; margin-top: 26px; border-radius: 999px;
        overflow: hidden; background: var(--boot-track); animation: boot-fade 0.4s ease 0.3s both;
      }
      #boot .boot-fill {
        position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px;
        background: var(--boot-brand); transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        overflow: hidden;
      }
      #boot .boot-fill::after {
        content: ""; position: absolute; top: 0; bottom: 0; width: 48px;
        background: linear-gradient(90deg, transparent, var(--boot-page), transparent); opacity: 0.35;
        animation: boot-shine 1.4s ease-in-out infinite;
      }
      #boot .boot-say {
        min-height: 18px; margin-top: 12px; font: 500 13px/18px system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--boot-words); animation: boot-fade 0.4s ease 0.38s both; transition: opacity 0.18s ease;
      }
      @keyframes boot-peek { from { transform: translateY(45%) scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes boot-blink { 0%, 90%, 100% { transform: scaleY(1); } 93% { transform: scaleY(0.12); } 96% { transform: scaleY(1); } }
      @keyframes boot-fade { from { opacity: 0; } }
      @keyframes boot-rise { from { opacity: 0; transform: translateY(6px); } }
      @keyframes boot-shine { from { left: -48px; } to { left: 100%; } }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-ghost, #boot .boot-eyes, #boot .boot-shadow, #boot .boot-word, #boot .boot-fill::after { animation: none; }
      }
      /* The whole screen drags the window, as the page's title bar does once it is there. */
      html, body { height: 100%; -webkit-app-region: drag; user-select: none; -webkit-user-select: none; }
    </style>
  </head>
  <body>

      <div class="boot-bar"><div class="boot-fill"></div></div>
      <div class="boot-say">Loading Nook</div>
    </div>
  </body>
</html>
