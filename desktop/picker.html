<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Share your screen</title>
    <style>
      /* The Nook brand tokens (nook-brand/tokens/tokens.css): cream in light, deep night in dark. */
      :root { color-scheme: light; --bg: #FBF7EF; --panel: #FFFFFF; --line: #E8E1D3; --strong: #8C8499; --text: #1E1B2E; --faint: #5B5670; --brand: #1E1B2E; --on-brand: #FBF7EF; --ring: #B83E10; }
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: dark; --bg: #15131F; --panel: #1E1B2E; --line: #332E47; --strong: #6E6886; --text: #F4EFE6; --faint: #B3ADC6; --brand: #FBF7EF; --on-brand: #1E1B2E; --ring: #FF9E78; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "DM Sans", system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
      header { padding: 14px 18px 0; }
      h1 { font-size: 16px; margin: 0 0 10px; }
      .tabs { display: flex; gap: 6px; }
      .tabs button { background: none; border: 1.5px solid var(--strong); color: var(--faint); min-height: 36px; padding: 0 16px; border-radius: 999px; cursor: pointer; font: inherit; }
      .tabs button[aria-selected='true'] { color: var(--on-brand); background: var(--brand); border-color: var(--brand); }
      main { flex: 1; overflow: auto; padding: 14px 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; align-content: start; }
      .item { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 8px; cursor: pointer; text-align: left; color: inherit; font: inherit; }
      .item:hover { border-color: var(--strong); }
      .item[aria-pressed='true'] { border-color: var(--brand); }
      .item img.thumb { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; border-radius: 10px; display: block; }
      .name { display: flex; align-items: center; gap: 6px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .name img { width: 16px; height: 16px; flex: none; }
      .name span { overflow: hidden; text-overflow: ellipsis; }
      footer { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); }
      footer label { color: var(--faint); display: flex; gap: 6px; align-items: center; }
      .spacer { flex: 1; }
      footer button { font: inherit; min-height: 44px; padding: 0 24px; border-radius: 999px; border: 0; box-shadow: inset 0 0 0 1.5px var(--strong); background: transparent; color: var(--text); cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
      footer button.go { background: var(--brand); color: var(--on-brand); box-shadow: none; }
      footer button:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <header>
      <h1>Share your screen</h1>
      <div class="tabs" role="tablist">
        <button role="tab" data-kind="screen" aria-selected="true">Screens</button>
        <button role="tab" data-kind="window" aria-selected="false">Windows</button>
      </div>
    </header>
    <main id="grid"></main>
    <footer>
      <label id="audio-wrap" hidden><input type="checkbox" id="audio" checked /> Share the sound</label>
      <div class="spacer"></div>
      <button id="cancel">Cancel</button>
      <button id="go" class="go" disabled>Share</button>
    </footer>
    <script>
      const grid = document.getElementById('grid')
      const go = document.getElementById('go')
      const audio = document.getElementById('audio')
      let sources = []
      let kind = 'screen'
      let chosen = null

      function render() {
        grid.replaceChildren()
        for (const s of sources.filter((s) => s.kind === kind)) {
          const b = document.createElement('button')
          b.className = 'item'
          b.setAttribute('aria-pressed', String(s.id === chosen))
          const thumb = document.createElement('img')
          thumb.className = 'thumb'
          thumb.src = s.thumb
          thumb.alt = ''
          const name = document.createElement('div')
          name.className = 'name'
          if (s.icon) {
            const icon = document.createElement('img')
            icon.src = s.icon
            icon.alt = ''
            name.append(icon)
          }
          const label = document.createElement('span')
          label.textContent = s.name
          name.append(label)
          b.append(thumb, name)
          b.onclick = () => {
            chosen = s.id
            go.disabled = false
            render()
          }
          b.ondblclick = () => window.picker.choose(s.id, audio.checked)
          grid.append(b)
        }
      }

      for (const tab of document.querySelectorAll('[role=tab]')) {
        tab.onclick = () => {
          kind = tab.dataset.kind
          for (const t of document.querySelectorAll('[role=tab]')) t.setAttribute('aria-selected', String(t === tab))
          render()
        }
      }
      go.onclick = () => chosen && window.picker.choose(chosen, audio.checked)
      document.getElementById('cancel').onclick = () => window.picker.choose(null)
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') window.picker.choose(null)
        if (e.key === 'Enter' && chosen) window.picker.choose(chosen, audio.checked)
      })

      window.picker.list().then(({ sources: list, canShareAudio }) => {
        sources = list
        document.getElementById('audio-wrap').hidden = !canShareAudio
        const firstScreen = sources.find((s) => s.kind === 'screen')
        chosen = firstScreen ? firstScreen.id : null
        go.disabled = !chosen
        render()
      })
    </script>
  </body>
</html>
