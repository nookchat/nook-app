<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FBF7EF" />
    <script>
      // The saved theme goes on before the first paint, so the page never flashes the wrong one.
      ;(function () {
        var root = document.documentElement
        try {
          var saved = localStorage.getItem('nook.theme.v1')
          if (saved === 'light' || saved === 'dark') root.dataset.theme = saved
        } catch (e) {}
        var dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.querySelector('meta[name="theme-color"]').content = dark ? '#15131F' : '#FBF7EF'
      })()
    </script>
    <meta
      name="description"
      content="Spaces with text channels, voice and screen sharing. Run them on your own server, or peer to peer with no server at all. End to end encrypted either way."
    />
    <!-- The room secret is in the URL fragment: send no referrer. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="canonical" href="https://cathode.video/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nook" />
    <meta property="og:url" content="https://cathode.video/" />
    <meta property="og:title" content="Nook: chat, voice and screen sharing" />
    <meta
      property="og:description"
      content="Text channels, voice and screen sharing in one place. Host it on your own server, or go peer to peer with no server at all. No account, and end to end encrypted."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/app-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nook" />
    <style>
      /* The loading screen: plain CSS in the page, so it shows before any script or stylesheet arrives.
         The colours are the brand tokens (src/brand/tokens.css) for each theme. */
      :root { --boot-page: #FBF7EF; --boot-brand: #1E1B2E; --boot-on-brand: #FBF7EF; --boot-track: #E8E1D3; }
      :root[data-theme="dark"] { --boot-page: #15131F; --boot-brand: #FBF7EF; --boot-on-brand: #1E1B2E; --boot-track: #332E47; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { --boot-page: #15131F; --boot-brand: #FBF7EF; --boot-on-brand: #1E1B2E; --boot-track: #332E47; }
      }
      html, body { margin: 0; background: var(--boot-page); }
      #boot {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 20px; background: var(--boot-page);
        transition: opacity 0.2s ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot svg { width: 88px; height: 88px; overflow: visible; animation: boot-float 2.8s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
      #boot .boot-body { fill: var(--boot-brand); }
      #boot .boot-eyes { fill: var(--boot-on-brand); transform-box: fill-box; transform-origin: center; animation: boot-blink 5.2s ease-in-out infinite; }
      #boot .boot-cheeks { fill: #FF8A5B; }
      #boot .boot-bar { position: relative; width: 120px; height: 4px; border-radius: 999px; overflow: hidden; background: var(--boot-track); }
      #boot .boot-bar::after {
        content: ""; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 999px;
        background: var(--boot-brand); animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide { from { left: -40%; } to { left: 100%; } }
      @keyframes boot-float { 50% { transform: translateY(-5%); } }
      @keyframes boot-blink { 0%, 90%, 100% { transform: scaleY(1); } 93% { transform: scaleY(0.12); } 96% { transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) {
        #boot svg, #boot .boot-eyes, #boot .boot-bar::after { animation: none; }
        #boot .boot-bar::after { left: 30%; }
      }
    </style>
    <title>Nook: chat, voice and screen sharing</title>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Nook is loading">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <g transform="translate(3.5 -7)">
          <path class="boot-body" d="M24 60 A36 36 0 0 1 96 60 L96 96 Q90 104 84 97 Q78 90 72 97 Q66 104 60 97 Q54 90 48 97 Q42 104 36 97 L17 110 Q24 100 24 86 Z" />
          <g class="boot-eyes"><ellipse cx="49" cy="62" rx="5" ry="7" /><ellipse cx="71" cy="62" rx="5" ry="7" /></g>
          <g class="boot-cheeks"><circle cx="40" cy="75" r="4.5" /><circle cx="80" cy="75" r="4.5" /></g>
        </g>
      </svg>
      <div class="boot-bar"></div>
    </div>
    <div id="app"></div>
    <noscript>Nook needs JavaScript, because the whole app runs in your browser.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
