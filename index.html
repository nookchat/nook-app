<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#131519" />
    <meta
      name="description"
      content="Spaces with text channels, voice and screen sharing. Run them on your own server, or peer to peer with no server at all. End to end encrypted either way."
    />
    <!-- The room secret is in the URL fragment: send no referrer. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="canonical" href="https://cathode.video/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nook" />
    <meta property="og:url" content="https://cathode.video/" />
    <meta property="og:title" content="Nook: chat, voice and screen sharing" />
    <meta
      property="og:description"
      content="Text channels, voice and screen sharing in one place. Host it on your own server, or go peer to peer with no server at all. No account, and end to end encrypted."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/nook-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nook" />
    <style>
      /* The loading screen: plain CSS in the page, so it shows before any script or stylesheet arrives. */
      html, body { margin: 0; background: #0a0b0e; }
      #boot {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; background: #0a0b0e;
        color: #9095a3; font: 500 14px/1.4 "Inter var", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity 0.2s ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot svg { width: 64px; height: 64px; animation: boot-breathe 1.8s ease-in-out infinite; }
      #boot .boot-name { color: #eef0f5; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
      #boot .boot-bar { position: relative; width: 140px; height: 3px; border-radius: 3px; overflow: hidden; background: #1b1d24; }
      #boot .boot-bar::after {
        content: ""; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 3px;
        background: #3cc8ff; animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide { from { left: -40%; } to { left: 100%; } }
      @keyframes boot-breathe { 50% { transform: scale(0.94); opacity: 0.85; } }
      @media (prefers-reduced-motion: reduce) {
        #boot svg, #boot .boot-bar::after { animation: none; }
        #boot .boot-bar::after { left: 30%; }
      }
    </style>
    <title>Nook: chat, voice and screen sharing</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 22.5v5M10.5 28.5h11' stroke='%230d3a72' stroke-width='2.6' stroke-linecap='round'/%3E%3Crect x='2' y='4.5' width='28' height='19' rx='2.5' fill='%232f7fd6' stroke='%23fff' stroke-width='1.3'/%3E%3Crect x='6.5' y='8' width='19' height='11' fill='%2306121f'/%3E%3Cpath d='M8 16.5h4l2-5.5 2 5.5h6' fill='none' stroke='%236dfb7d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="boot" role="status" aria-label="Nook is loading">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 22.5v5M10.5 28.5h11" stroke="#0d3a72" stroke-width="2.6" stroke-linecap="round"/><rect x="2" y="4.5" width="28" height="19" rx="2.5" fill="#2f7fd6" stroke="#fff" stroke-width="1.3"/><rect x="6.5" y="8" width="19" height="11" fill="#06121f"/><path d="M8 16.5h4l2-5.5 2 5.5h6" fill="none" stroke="#6dfb7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="boot-name">Nook</div>
      <div class="boot-bar"></div>
    </div>
    <div id="app"></div>
    <noscript>Nook needs JavaScript, because the whole app runs in your browser.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
