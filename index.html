<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <!-- Cathode wears Windows XP, which had no dark mode, so neither does this. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0a58e8" />
    <meta
      name="description"
      content="Peer to peer screen share with audio. Nothing is stored and no media server sees your stream."
    />
    <!-- The room secret lives in the URL fragment. Keep referrers off, so the secret never leaks. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="canonical" href="https://cathode.video/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cathode" />
    <meta property="og:url" content="https://cathode.video/" />
    <meta property="og:title" content="Cathode: share your screen, peer to peer" />
    <meta
      property="og:description"
      content="Send one link. Your screen and your sound travel straight to whoever opens it. No media server, no recording, no account."
    />
    <meta name="twitter:card" content="summary" />
    <title>Cathode</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 22.5v5M10.5 28.5h11' stroke='%230d3a72' stroke-width='2.6' stroke-linecap='round'/%3E%3Crect x='2' y='4.5' width='28' height='19' rx='2.5' fill='%232f7fd6' stroke='%23fff' stroke-width='1.3'/%3E%3Crect x='6.5' y='8' width='19' height='11' fill='%2306121f'/%3E%3Cpath d='M8 16.5h4l2-5.5 2 5.5h6' fill='none' stroke='%236dfb7d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>Cathode needs JavaScript, because the whole app runs in your browser.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
